    type: Documentation
  - url: graphql/fragment-dev-graphql.md
    type: GraphQL
  - url: graphql/fragment-dev-schema.graphql
    type: GraphQLSchema
  description: Match ledger activity against external money movement. reconcileTx reconciles
    a transaction idempotently by transaction ID, while syncCustomAccounts and syncCustomTxs
    ingest external accounts and transactions to keep the ledger and source systems
    in agreement.
