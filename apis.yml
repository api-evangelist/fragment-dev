  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://fragment.dev/docs
  baseURL: https://api.fragment.dev/graphql
  properties:
  - url: https://fragment.dev/docs
    type: Documentation
  - url: graphql/fragment-dev-graphql.md
    type: GraphQL
  - url: graphql/fragment-dev-schema.graphql
    type: GraphQLSchema
  description: Create and query Ledgers from a stored Schema. A Ledger is an isolated
    database for tracking money for a use case, tenant, or environment, created with
    createLedger and read with the ledger query.
- aid: fragment-dev:fragment-ledger-entries-api
  name: Fragment Ledger Entries API
  tags:
  - Ledger Entries
  - Postings
  - Double-Entry
  - Idempotency
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://fragment.dev/docs
  baseURL: https://api.fragment.dev/graphql
  properties:
  - url: https://fragment.dev/docs
    type: Documentation
  - url: graphql/fragment-dev-graphql.md
    type: GraphQL
  - url: graphql/fragment-dev-schema.graphql
    type: GraphQLSchema
  description: Post immutable, balanced double-entry Ledger Entries made of debit and
    credit lines against accounts. Uses addLedgerEntry with an idempotency key (ik),
    reverseLedgerEntry to correct posted entries, and the ledgerEntry query to read
    a single entry back.
