  description: Single GraphQL endpoint for defining a ledger Schema, creating Ledgers,
    posting balanced double-entry Ledger Entries, and reading balances and lines.
    All write mutations are idempotent via an idempotency key (ik). The endpoint is
    region-scoped (for example api.us-west-2.fragment.dev) and authenticated with
    OAuth2 client-credentials Bearer tokens.
- aid: fragment-dev:fragment-schema-api
  name: Fragment Schema API
  tags:
  - Schema
  - Chart of Accounts
  - Entry Types
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://fragment.dev/docs
  baseURL: https://api.fragment.dev/graphql
  properties:
  - url: https://fragment.dev/docs
    type: Documentation
  - url: graphql/fragment-dev-graphql.md
    type: GraphQL
  - url: graphql/fragment-dev-schema.graphql
    type: GraphQLSchema
  description: Define and version the ledger Schema - the chart of accounts, account
    types (asset, liability, income, expense), currency modes, and the ledger entry
    types your product posts. Stored with the storeSchema mutation and read back via
    the schema field on a ledger.
