    type: Documentation
  - url: graphql/fragment-dev-graphql.md
    type: GraphQL
  - url: graphql/fragment-dev-schema.graphql
    type: GraphQLSchema
  description: Read real-time balances and the underlying lines. Query overall ledger
    balances (getLedgerBalances), per-account balances (getLedgerAccountBalances),
    and the debit/credit lines behind an account (getLedgerAccountLines), across single
    or multi-currency accounts.
