aid: fragment-dev
url: https://raw.githubusercontent.com/api-evangelist/fragment-dev/refs/heads/main/apis.yml
name: Fragment
kind: company
description: Fragment is a ledger API for engineering teams. It provides a real-time,
  double-entry ledger to track money movement, model balances, and reconcile against
  external systems (banks, processors, PSPs). The product is GraphQL-first - developers
  define a Schema (chart of accounts and entry types), create Ledgers, post immutable
  Ledger Entries composed of balanced debit/credit lines, and read balances and lines
  back through a single GraphQL endpoint. Every write mutation is idempotent.
